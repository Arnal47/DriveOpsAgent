name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m driveops_agent.cli eval
      - run: python -c "import json; r=json.load(open('reports/v1_eval.json')); assert r['task_success_rate'] >= .9 and r['tool_selection_accuracy'] >= .9 and r['evidence_coverage'] >= .9 and r['unsupported_claim_rate'] <= .05 and r['hallucinated_source_rate'] == 0, r"
      - run: python -m driveops_agent.cli run --task 'why CAN timeout enters failsafe' --provider mock
      - run: python -c "import json; r=json.load(open('reports/v1_eval.json')); required=['provider_error_recovery_rate','tool_failure_recovery_rate','review_routing_accuracy','memory_provenance_accuracy','trace_completeness']; assert all(k in r for k in required), r; assert r['review_routing_accuracy']>=.9 and r['memory_provenance_accuracy']>=.9 and r['trace_completeness']==1.0 and r['provider_error_recovery_rate']>=.9 and r['tool_failure_recovery_rate']>=.9, r"
      - run: python -c "from pathlib import Path; from driveops_agent.agent import DriveOpsAgent; from driveops_agent.providers import MockProvider; a=DriveOpsAgent(Path('data'),Path('reports'),MockProvider()); s=a.run('conflict CAN timeout'); assert a.memory.details(s.run_id)['tool_calls']; assert DriveOpsAgent(Path('data'),Path('reports'),MockProvider()).review(s.run_id,True).status.value=='complete'"
      - run: python -c "import json, pathlib; files=list(pathlib.Path('reports/traces').glob('*.jsonl')); assert files; required={'run_id','step_id','timestamp','event_type','tool','arguments','latency_ms','success','error','evidence_ids'}; assert all(required <= set(json.loads(line)) for p in files for line in p.read_text().splitlines())"
